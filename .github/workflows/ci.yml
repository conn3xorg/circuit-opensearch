name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # The host container is privileged, so OpenSearch's systemd unit
          # can set up its sandbox.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        env:
          TF_VAR_admin_password: Ci-only-Passw0rd!
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Check cluster health, then index a document and find it
        run: |
          sudo podman exec -i circuit-opensearch sh -eu <<'EOF'
          auth='admin:Ci-only-Passw0rd!'
          curl -sSfk -u "$auth" https://127.0.0.1:9200/_cluster/health | tee /dev/stderr | grep -Eq '"status":"(green|yellow)"'
          curl -sSfk -u "$auth" https://127.0.0.1:9200 | grep -q '"cluster_name" : "local"'
          curl -sSfk -u "$auth" -X PUT -H 'Content-Type: application/json' 'https://127.0.0.1:9200/books/_doc/1?refresh=true' -d '{"title":"The Left Hand of Darkness"}'
          curl -sSfk -u "$auth" 'https://127.0.0.1:9200/books/_search?q=title:darkness' | grep -q '"_id":"1"'
          EOF
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
